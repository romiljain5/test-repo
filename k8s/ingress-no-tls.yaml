# Triggers: Ingress - ensure TLS (reminder to add spec.tls)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-ingress
spec:
  rules:
    - host: demo.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-nodeport
                port:
                  number: 80
  # spec.tls not configured - bot should remind
