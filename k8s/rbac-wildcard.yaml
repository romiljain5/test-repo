# Triggers: ClusterRole/Role with wildcard permissions (apiGroups/resources/verbs: *)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: overly-permissive
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bind-overly-permissive
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: overly-permissive
subjects:
  - kind: ServiceAccount
    name: default
    namespace: default
